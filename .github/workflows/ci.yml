name: 持续集成

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            gazebo_sim/pyproject.toml
            onboard/pyproject.toml
            ground_station/pyproject.toml
      - name: 安装测试依赖（视觉模型在完整仿真验收中运行）
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './gazebo_sim[test]' pyserial==3.5
          python -m pip install --no-deps -e ./onboard -e ./ground_station
      - name: 隐私、源码包与三个模块测试
        env:
          CUADC_SKIP_SDF: "1"
        run: ./scripts/verify_release.sh
      - name: 构建经过复检的公开源码包
        run: python scripts/build_release_packages.py public
