name: 功能建议
description: 提一个新功能或改进建议
title: "[功能建议] "
labels: ["enhancement"]
assignees: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题或需求
      description: 这个功能解决什么问题？或者现在有什么用例没被满足？
      placeholder: 当前仿真无法覆盖某个场景，因为...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 描述你希望看到的功能或改动。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有想过其他解决办法或临时绕过的方式？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 请补充任务、组别、物理或视觉影响，以及截图或参考资料。
