[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuadc-gazebo-sim"
version = "2.0.2"
description = "CUADC Gazebo and ArduPlane closed-loop simulation"
readme = {text = "CUADC 项目模块。统一中文使用说明见仓库根目录 README.md。", content-type = "text/plain"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "future==1.0.0",
  "MAVProxy==1.8.74",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "pymavlink==2.4.49",
  "PyYAML==6.0.3",
  "setuptools==80.9.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.11.1"]
vision = ["ultralytics==8.4.106"]
test = ["pytest==9.1.1"]

[project.scripts]
cuadc-sim = "cuadc_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
